<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Flyer · Chemical Engineering birthdays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F1F6F5;--ink:#0E2A2B;--muted:#53706F;--line:#C6D6D4;--flask:#0F8B8D;--ind:#D81B72;--ind-d:#B3135D;
--font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--font);padding:20px 16px 56px;display:flex;justify-content:center}
main{width:100%;max-width:520px}
.back{display:inline-block;color:var(--ink);font-weight:600;margin-bottom:10px}
h1{font-weight:800;font-size:1.5rem;line-height:1.15;margin:0 0 14px;letter-spacing:-.01em}
canvas{display:block;width:100%;height:auto;border-radius:6px;background:#0B0D0C}
.ui{margin-top:18px}
label{display:block;font-weight:600;margin:0 0 6px}
input[type=text],select,textarea{width:100%;font:inherit;color:inherit;padding:11px 12px;min-height:46px;border:1.5px solid var(--line);border-radius:8px;background:#fff;margin-bottom:14px}
textarea{resize:vertical}
:focus-visible{outline:3px solid var(--flask);outline-offset:2px}
.btns{display:grid;gap:10px;margin-top:4px}
button{font:600 1rem var(--font);min-height:50px;border-radius:8px;cursor:pointer;border:1.5px solid var(--ink);background:#fff;color:var(--ink)}
button.go{background:var(--ind);border-color:var(--ind);color:#fff}
button.go:hover{background:var(--ind-d)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#note{min-height:1.4em;margin:12px 0 0;color:var(--muted);font-weight:600}
@media print{.ui,.back,h1{display:none!important}body{background:#fff;padding:0;display:block}main{max-width:none}canvas{width:18cm;height:18cm;margin:0 auto;border-radius:0}@page{margin:1cm}}
</style>
</head>
<body>
<main>
  <a class="back" href="/admin">Back to the list</a>
  <h1 id="who">Birthday flyer</h1>
  <canvas id="c" width="1080" height="1080" role="img" aria-label="Birthday flyer preview"></canvas>

  <div class="ui">
    <label for="nm">Name on the flyer</label>
    <input id="nm" type="text" maxlength="60" autocomplete="off">
    <label for="tpl">Message style</label>
    <select id="tpl"></select>
    <label for="msg">Message <span style="font-weight:400;color:var(--muted)">(you can edit it)</span></label>
    <textarea id="msg" rows="3" maxlength="150"></textarea>
    <div class="btns">
      <button class="go" id="share">Share to WhatsApp</button>
      <div class="row2"><button id="dl">Download image</button><button id="pr">Print</button></div>
    </div>
    <p id="note" role="status" aria-live="polite"></p>
  </div>
</main>

const GOLD='#D4AF5F', GOLD2='#F1D98F', INK='#0B0D0C', CREAM='#F4EAD2', W=1080;

function hex(ctx,cx,cy,r){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i+30),x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();}
function corner(ctx,x,y,sx,sy){
  ctx.save();ctx.translate(x,y);ctx.scale(sx,sy);
  const r=34;
  [[0,0],[1,0],[0,1],[2,0],[1,1],[0,2]].forEach(([q,w])=>{
    const cx=r*Math.sqrt(3)*(q+w/2),cy=r*1.5*w;
    hex(ctx,cx,cy,r);ctx.fillStyle=INK;ctx.fill();
    ctx.strokeStyle=GOLD;ctx.lineWidth=2.5;ctx.globalAlpha=(q+w===2&&q!==1)?.55:1;ctx.stroke();ctx.globalAlpha=1;
    if((q===0&&w===0)||(q===1&&w===1)){ctx.beginPath();ctx.arc(cx,cy,r*.52,0,Math.PI*2);ctx.lineWidth=2;ctx.stroke();}
  });
  ctx.restore();
}
function arch(ctx,x,y,w,h){const r=w/2;ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x,y+r);ctx.arc(x+r,y+r,r,Math.PI,0);ctx.lineTo(x+w,y+h);ctx.closePath();}
function fit(ctx,text,style,size,maxW){let s=size;do{ctx.font=style.replace('{s}',s);if(ctx.measureText(text).width<=maxW)break;s-=2;}while(s>20);return s;}
function wrap(ctx,text,maxW){const words=text.split(/\s+/).filter(Boolean),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;}

function drawFlyer(ctx,d){
  ctx.clearRect(0,0,W,W);
  ctx.fillStyle=INK;ctx.fillRect(0,0,W,W);
  ctx.strokeStyle=GOLD;ctx.lineWidth=3;ctx.strokeRect(28,28,W-56,W-56);
  ctx.lineWidth=1.5;ctx.strokeRect(44,44,W-88,W-88);
  corner(ctx,46,46,1,1);corner(ctx,W-46,46,-1,1);corner(ctx,46,W-46,1,-1);corner(ctx,W-46,W-46,-1,-1);
  ctx.textAlign='center';ctx.textBaseline='alphabetic';

  // logo and department
  ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.beginPath();ctx.arc(540,108,55,0,Math.PI*2);ctx.stroke();
  if(d.logo)ctx.drawImage(d.logo,490,58,100,100);
  ctx.fillStyle=GOLD;if('letterSpacing' in ctx)ctx.letterSpacing='3px';
  ctx.font=`600 27px ${SERIF}`;ctx.fillText('Department of Chemical Engineering, UNIPORT',540+1.5,200);
  if('letterSpacing' in ctx)ctx.letterSpacing='0px';

  // heading
  const g=ctx.createLinearGradient(0,235,0,305);g.addColorStop(0,GOLD2);g.addColorStop(1,GOLD);
  ctx.fillStyle=g;fit(ctx,'Happy Birthday',`600 {s}px ${SERIF}`,104,780);
  ctx.fillText('Happy Birthday',540,302);

  // photo in an arch
  const x=350,y=348,w=380,h=404;
  ctx.strokeStyle=GOLD;ctx.lineWidth=1.5;arch(ctx,x-18,y-18,w+36,h+36);ctx.stroke();
  ctx.lineWidth=4;arch(ctx,x-7,y-7,w+14,h+14);ctx.stroke();
  ctx.save();arch(ctx,x,y,w,h);ctx.clip();
  if(d.photo){
    const s=Math.max(w/d.photo.width,h/d.photo.height),dw=d.photo.width*s,dh=d.photo.height*s;
    ctx.drawImage(d.photo,x+(w-dw)/2,y+(h-dh)*.3,dw,dh);
  }else{
    ctx.fillStyle='#161A1B';ctx.fillRect(x,y,w,h);
    hex(ctx,540,y+h/2,150);ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.globalAlpha=.5;ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=GOLD;ctx.font=`600 150px ${SERIF}`;ctx.textBaseline='middle';
    ctx.fillText((d.name.split(/\s+/).map(p=>p[0]||'').slice(0,2).join('')||'').toUpperCase(),540,y+h/2+8);ctx.textBaseline='alphabetic';
  }
  ctx.restore();

  // name and divider
  ctx.fillStyle=CREAM;fit(ctx,d.name,`600 {s}px ${SERIF}`,62,820);ctx.fillText(d.name,540,832);
  ctx.strokeStyle=GOLD;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(400,860);ctx.lineTo(515,860);ctx.moveTo(565,860);ctx.lineTo(680,860);ctx.stroke();
  hex(ctx,540,860,11);ctx.fillStyle=INK;ctx.fill();ctx.stroke();

  // message
  ctx.fillStyle=CREAM;
  let size=32,lines;
  do{ctx.font=`italic 500 ${size}px ${SERIF}`;lines=wrap(ctx,d.message,780);size-=2;}while(lines.length>3&&size>20);
  const lh=size+10;lines.slice(0,3).forEach((ln,i)=>ctx.fillText(ln,540,924+i*lh));
}
/*END_DRAW*/

const $=id=>document.getElementById(id);
const c=$('c'),ctx=c.getContext('2d');
const title=s=>s.toLowerCase().replace(/(^|[\s\-'’])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
let data={name:'',message:'',photo:null,logo:null},slug='member',first='';

function draw(){drawFlyer(ctx,data);}
function toBlob(){return new Promise(r=>c.toBlob(r,'image/png'));}
function download(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`birthday-${slug}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
const note=t=>$('note').textContent=t;

async function init(){
  const id=new URLSearchParams(location.search).get('id');
  let r;
  try{r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list'})});}
  catch(e){return note('No connection. Check your internet and reload.');}
  if(r.status===401){location.href='/admin';return;}
  const m=((await r.json()).members||[]).find(x=>String(x.id)===id);
  if(!m)return note('That member was not found. Go back to the list and try again.');
  data.name=title(m.name.trim());first=data.name.split(' ')[0];
  slug=data.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'member';
  $('who').textContent=`Flyer for ${first}`;$('nm').value=data.name;
  TEMPLATES.forEach((t,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`Message ${i+1}`;$('tpl').appendChild(o);});
  const fill=()=>{$('msg').value=TEMPLATES[$('tpl').value].replace('{first}',first);data.message=$('msg').value;draw();};
  data.message=TEMPLATES[0].replace('{first}',first);$('msg').value=data.message;
  $('tpl').addEventListener('change',fill);
  $('msg').addEventListener('input',()=>{data.message=$('msg').value;draw();});
  $('nm').addEventListener('input',()=>{data.name=$('nm').value.trim()||data.name;draw();});
  try{await Promise.all([document.fonts.load(`600 100px "Cormorant Garamond"`),document.fonts.load(`italic 500 30px "Cormorant Garamond"`)]);}catch(e){}
  data.logo=await loadImg(LOGO).catch(()=>null);
  if(m.has_photo)data.photo=await loadImg(`/api/admin?photo=${m.id}&v=${Date.now()}`).catch(()=>null);
  draw();
}

$('dl').addEventListener('click',async()=>{download(await toBlob());note('Saved to your downloads.');});
$('pr').addEventListener('click',()=>window.print());
$('share').addEventListener('click',async()=>{
  const blob=await toBlob(),file=new File([blob],`birthday-${slug}.png`,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],text:data.message});}catch(e){}
  }else{download(blob);note('Sharing is not available on this device, so the image was downloaded. Attach it in WhatsApp.');}
});
init();
</script>
